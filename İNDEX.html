<style>
:root{--bg:#16222c;--ink:#f1e6cb;--mute:#b9ad92;--brass:#c9993f;--seal:#8f2f2a;--panel:#1d2c38;--line:#34495a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 'Alegreya Sans',Georgia,sans-serif;overflow-x:hidden}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(14px,4vw,32px)}

.btn{font:500 15px 'Alegreya Sans',sans-serif;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:3px;padding:7px 13px;cursor:pointer}
.btn:hover{border-color:var(--brass);color:var(--brass)}.btn:disabled{opacity:.3;cursor:default}
.btn:focus-visible,.pin:focus-visible,.li:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn.on{background:var(--brass);color:#2a1b08;border-color:var(--brass)}
.map{position:relative;border:3px solid var(--brass);border-radius:3px;box-shadow:0 14px 40px rgba(0,0,0,.45);line-height:0;background:#222}
.map img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
.map svg.route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.route path{fill:none;stroke:#5a1d1a;stroke-width:3;stroke-dasharray:3 9;stroke-linecap:round;opacity:.8}
.pin{position:absolute;transform:translate(-50%,-50%);width:clamp(22px,3vw,34px);aspect-ratio:1;border-radius:50%;border:2px solid #e8c77a;background:radial-gradient(circle at 35% 30%,#b8453d,var(--seal) 70%);color:#fbeed0;font:700 clamp(12px,1.7vw,18px)/1 'Cormorant Garamond',Georgia,serif;cursor:pointer;display:grid;place-items:center;padding:0;box-shadow:0 3px 8px rgba(0,0,0,.5);transition:transform .15s}
.pin:hover{transform:translate(-50%,-50%) scale(1.18)}
.pin.on{background:radial-gradient(circle at 35% 30%,#f0cf86,var(--brass) 70%);color:#2a1b08;transform:translate(-50%,-50%) scale(1.25)}
.pin.on::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--brass);animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.7);opacity:1}to{transform:scale(1.4);opacity:0}}
.map.drag .pin{cursor:grab;touch-action:none;outline:2px dashed #fff;outline-offset:3px}
h2.sec{font:700 30px 'Cormorant Garamond',Georgia,serif;margin:34px 0 12px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.li{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px 12px;color:var(--ink);font:inherit;cursor:pointer}
.li:hover{border-color:var(--brass)}
.li i{font:700 18px 'Cormorant Garamond',Georgia,serif;font-style:normal;flex:none;width:30px;height:30px;border-radius:50%;background:var(--seal);border:2px solid #e8c77a;display:grid;place-items:center}
.li span{display:block;line-height:1.25}.li small{color:var(--mute)}
footer{margin-top:44px;padding:20px 0 90px;border-top:1px solid var(--line);color:var(--mute);font-size:15px}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);z-index:30;background:var(--panel);border-left:3px solid var(--brass);padding:calc(20px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto;transform:translateX(105%);transition:transform .3s;box-shadow:-14px 0 40px rgba(0,0,0,.4)}
.panel.open{transform:none}
.top{display:flex;justify-content:space-between;align-items:center}
.badge{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--seal);border:2px solid #e8c77a;font:700 23px 'Cormorant Garamond',Georgia,serif}
.panel h2{font:700 34px/1.1 'Cormorant Garamond',Georgia,serif;margin:12px 0 2px}
.sub{color:var(--brass);margin:0 0 14px}
.photo{aspect-ratio:16/10;border-radius:2px;overflow:hidden;border:1px solid var(--line);background:#0f1920;line-height:0}
.photo img,.photo svg{width:100%;height:100%;object-fit:cover;display:block}
.cap{font-size:14px;color:var(--mute);margin:6px 0 0;font-style:italic}
.thumbs{display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap}
.thumbs button{width:72px;aspect-ratio:16/10;border:2px solid transparent;padding:0;border-radius:2px;overflow:hidden;cursor:pointer;background:none;opacity:.6}
.thumbs button.on{border-color:var(--brass);opacity:1}
.thumbs svg,.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.txt p{margin:0 0 12px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);gap:8px}
.in{width:100%;font:inherit;color:var(--ink);background:#101b23;border:1px solid var(--line);border-radius:3px;padding:8px 10px;margin:6px 0}
.in.h{font:700 26px 'Cormorant Garamond',Georgia,serif}
textarea.in{min-height:170px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.admin{display:none;background:var(--panel);border:1px solid var(--brass);border-radius:3px;padding:14px;margin:0 0 18px}
.admin.show{display:block}.admin label{font-size:14px;color:var(--mute)}
.music{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;max-width:calc(100% - 28px)}
.mbox{margin-bottom:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;width:min(316px,100%)}
.mbox iframe{width:100%;height:152px;border:0;border-radius:10px;display:block}
.mbox p{margin:6px 8px;font-size:14px;color:var(--mute)}
.mbox.min{position:absolute;opacity:0;pointer-events:none;width:300px;bottom:0}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--brass);color:#2a1b08;padding:8px 16px;border-radius:3px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.live{display:none;position:relative;height:min(72vh,680px);min-height:380px;border:3px solid var(--brass);border-radius:3px;overflow:hidden;background:#cdd6d8;touch-action:none;cursor:grab;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.live.show{display:block}.live .tl{position:absolute;inset:0}
.live img.t{position:absolute;width:256px;height:256px;max-width:none;user-select:none;-webkit-user-drag:none}
.live svg.lr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lr path{fill:none;stroke:#8f2f2a;stroke-width:3;stroke-dasharray:2 8;stroke-linecap:round}
.zc{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:5}
.zc .btn{background:var(--panel);min-width:42px}
.attr{position:absolute;right:6px;bottom:4px;font-size:12px;color:#222;background:rgba(255,255,255,.75);padding:1px 6px;border-radius:2px;z-index:5}
.note{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,86%);background:var(--panel);border:1px solid var(--brass);padding:14px 16px;z-index:6;text-align:center}
.pop{display:none;position:absolute;z-index:8;width:min(270px,80%);transform:translate(-50%,calc(-100% - 26px));background:var(--panel);border:1px solid var(--brass);border-radius:4px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.5);line-height:1.4;cursor:default}
.pop.dn{transform:translate(-50%,26px)}.pop b{font:700 20px 'Cormorant Garamond',Georgia,serif;display:block}
.pop small{color:var(--brass);display:block}.pop p{margin:6px 0 8px;font-size:15px}
.live .pin{z-index:4}
.live.old::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:rgba(214,176,110,.3);mix-blend-mode:multiply}
.live.old::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at center,rgba(255,240,200,0) 55%,rgba(90,55,20,.45) 100%);box-shadow:inset 0 0 0 5px rgba(60,35,12,.55)}
.lb{display:none;position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}.live.old .lb{display:block}
.lb .l{position:absolute;transform:translate(-50%,-50%);white-space:pre;text-align:center;font-family:'Cormorant Garamond',Georgia,serif;color:#3a2410;text-shadow:0 0 3px rgba(240,225,185,.95),0 0 7px rgba(240,225,185,.85);line-height:1.1}
.l.c{letter-spacing:.26em;font-weight:700}.l.s{font-style:italic;color:#27506b;letter-spacing:.35em}.l.k{font-style:italic;letter-spacing:.04em;font-weight:500}
.rose{display:none;position:absolute;left:10px;bottom:10px;width:68px;z-index:4;opacity:.85}.live.old .rose{display:block}

{n:1,x:80.2,y:50.2,ll:[41.008,28.978],t:"İstanbul",s:"7 Ekim 1720 · Hareket",p:["Osmanlı Devleti ile Fransa arasındaki ilişkileri geliştirmek ve Fransa'nın siyasi, ekonomik ve kültürel hayatını incelemek amacıyla Yirmisekiz Çelebi Mehmed Efendi olağanüstü elçi olarak görevlendirilir. Yanına divan kâtibi olan oğlu Mehmed Said Efendi ve 80 kişilik kalabalık bir maiyet verilir. Fransız elçisinin sağladığı kalyonla İstanbul'dan hareket edilir.","Mehmed Efendi'den yalnızca diplomatik görevini yerine getirmesi değil, Fransa'da görülen ve Osmanlı ülkesinde uygulanabilecek yenilikler hakkında da bilgi toplaması istenir. Avusturyalıların rakibi olan Fransa ile yakınlaşarak Avusturya'ya karşı bir cephe kurmak da sefaretin nedenlerindendir."],ph:[P("Osmanlı gemisi, 1700'ler","ist","#2f6f86","PH40t41QxNn5qhcJJrhaWsJolaDg62fPwKqfmSATztZ6DUNLCEwg0yv5FvvNicdUp_edTpUTyMtSEr1h2aH2q9o_g7nddNPQzk2B89EweErVhUX1wr_4GUZq8EqX2MdrOf9JA8PZFDQ0UPjLaxVIQipfUWHzpykHXtI2SKXDyirhuoBi9FTAuzoee0niLCf4")]},
{n:2,x:76.0,y:60.2,ll:[40.34,26.69],t:"Lapseki",s:"Ekim–Kasım 1720 · Geminin karaya oturması",p:["Yolculuk yağmurlu ve fırtınalı geçer. Ege yönünde ilerleyen gemi, şiddetli fırtına yüzünden Lapseki civarında kıyıya oturur. Bir süre burada beklenir, ardından yolculuğa devam edilir.","Bu olay, uzun deniz yolculuğunun ilk güçlüklerinden biridir. Çelebi Mehmed Efendi sefaretnamesinde bu güçlükleri kendi gözünden aktarır."],ph:[P("Çanakkale Boğazı, 1765 gravürü","ship","#3d7f95","e1po8OQDb7Ddya5HqiUpqvoLmcVj1AOaBX7rlk90SQ-E6sJ_qqZZTjFznezbERvVKqoleo0MqID0VwHXgxDFaYxqcvi5d7oW14m0BGVrsR82RmwBSl2oP5gsLkOTb2wEomirb31K2rNAmgZXkVI6vOyT88XcwwntwEiSZnZ8hcdlazTmRxK4qZqOvtGccNhm")]},
{n:3,x:49.1,y:86.8,ll:[35.9,14.51],t:"Malta",s:"Ekim–Kasım 1720 · Bir haftalık bekleyiş",p:["Olumsuz hava koşulları nedeniyle Malta'da yaklaşık bir hafta beklenir. Malta, Akdeniz'deki stratejik konumu kadar elçiliğin diplomatik görevleri bakımından da önem taşır.","Mehmed Efendi'ye, Malta Şövalyeleri'nin elindeki Osmanlı tutsaklarının serbest bırakılması meselesiyle ilgilenme görevi de verilmiştir."],ph:[P("Malta görünümleri, 1750–1800","port","#2f6f86","zdU9nUFImOrnKGRS8vdgYTPHHzj1Vnryb1xp_EXZPEVDvk9Deai6_DG6-AYtLIHKOKvUHQpsiMhbCkWGSwePKxCg3o__lvfQ2NXh009QdVDFOonG2c_mn2L2eE9pqTyBzQCdkt1hVt_P7RjknuUW7MI3OSMciOHKtMrbiQWZDiSaONtH1ZEqOgGpi8Wu9ZPA")]},
{n:4,x:27.9,y:51.4,ll:[43.124,5.928],t:"Toulon",s:"21 Kasım 1720 · Top atışlarıyla karşılama",p:["İstanbul'dan ayrılışın 46. gününde Toulon'a ulaşılır. Sefaretname çevirisinde, Osmanlı gemisinden 11 top atışıyla selam verildiği, Toulon tarafından da 300 top atışıyla karşılık verildiği ve şenlikler düzenlendiği anlatılır.","Bölgedeki veba salgını korkusu nedeniyle Fransız görevliler kalyona çıkmaz, görüşme sandaldan yapılır. Heyete et, sebze, meyve ve şekerlemeler gönderilir. Ertesi gün tören için gelen yetkili, fırtına yüzünden karşılamaya zamanında ulaşamadığını bildirir. Böylece Toulon'da hem görkemli bir karşılama hem de salgın ve hava koşullarının yol açtığı tedbirler yaşanır."],ph:[P("Vernet: Toulon limanı","port","#2f6f86","SSdTa33GfoiYIS9Hz2Ze6G3mwJ0BglTZmfFFPcD1n5nb6G36X91XuAwWb4lhltBbcjZ26bPksGtWAvWzbg0rVD5rSzEQKaYj71gKUa07HcTW9_BwWJQ5WHjSVaxoIPRAiRvG99Xi1OTDTk6JbFIr2g4CoRfV-9l3tMY8HYBUqTS_4Gyvelt1XUuxsaXdYvWx")]},
{n:5,x:25.1,y:53.3,ll:[43.404,4.988],t:"Boka (Bouc) Kalesi",s:"11 Aralık 1720 · Toulon'dan ayrılış",p:["Yolculuğun devamında Buka/Boka denilen kale limanına ulaşılır. Hava koşulları kötüleştiği için burada dört gün kadar beklenir.","Bu bekleyiş, Akdeniz'de deniz yolculuğunun rüzgâra ve hava şartlarına bağlı olduğunu gösteren önemli bir ayrıntıdır. Ardından Sète limanına doğru yola devam edilir."],ph:[P("Fırtınada yelkenli","ship","#1f5c78","aLsjbU9E9DkSeToSv34rRHVkIUzna9aQHV7fGS8A7p-QVHz_nJWA6JgbtwAtEO63JG9EFkM5JCHefnDy9XzK3n7z9sDoitwBAjLeN1a4xM4WZ0S2CP2Mhwv9dTC0uEWhCbMWi-DsBEhoq__YwWJDogDi_c6enFz_WXA44Lf9D_INOf55w3Sb8FmIK2XM06gd")]},
{n:6,x:21.6,y:53.3,ll:[43.403,3.697],t:"Sète (Cette)",s:"Aralık 1720 · Limana varış",p:["Boka'dan ayrıldıktan sonra Sète Kalesi'nin limanına gelinir. Fransız yetkililer elçilik heyetini karşılar ve geceyi limana üç saat uzaklıktaki bir kasabada, kendileri için hazırlanmış konakta geçirirler. Ertesi sabah tekrar gemiye binilir."],ph:[P("Sète limanı","port","#2f6f86","ndN0tZxH9cjcJnKuFGpaJYuPo6Jt0dJA3iudekUjn8vCmSF_GL19YA8nd2iIwjC5NWpGgD-Spi5bIV68xSooiWpe2Vdlu_36LYL4maj1W6-ShVX6AX3qc8eNnN3jGLJUz-2HGnpnYa-2wDV9LoeVDdQWR3mzHniXup8uEJlHR2VWS7EuFV3yjHc5_8UnYX07")]},
{n:7,x:23.8,y:47.4,ll:[43.517,3.887],t:"Maguelonne Adası",s:"17 Aralık 1720 – 25 Ocak 1721 · Karantina",p:["Sète çevresine ulaşıldıktan sonra salgın tehlikesi nedeniyle elçilik heyeti yaklaşık 40 gün karantinada tutulur. Karantina yeri, Montpellier yakınındaki Maguelonne Adası olarak tanımlanır.","Fransız sağlık görevlileri ve askerleri Osmanlı heyetiyle iletişim kurarken yanlarına asla yaklaşmaz. Mektup ve belgeleri sirkeli su dolu kapların içine attırıp maşalarla alırlar. Ağır tecrit şartlarına rağmen Mehmed Efendi ve 80 kişilik maiyeti, adadaki harap yapının bir odasını düzenleyip ibadet alanı hâline getirir."],ph:[P("Saint-Pierre de Maguelone katedrali","road","#a0793c","EQP9URIsGND6-6bByUuS8M8Gk9_xOUtvfmtt1_T4Po6L5BO_5IVPeR2rAVlW4KTimAXHTth1s9uEvcZN2XCZQLCB75c1lD-MS0RO06qLTMC3h7QH1YS4M-SRdpVnV87-kmn0TNpZtjpJ6Bkhl4nLEVhGeLOKge7GVsMdj7D8-qNP2kA2Mxxp8iEn6NMy0cb0")]},
{n:8,x:18.9,y:51.3,ll:[43.28,2.2],t:"Canal du Midi",s:"25 Ocak 1721'den itibaren · Kanal yolculuğu",p:["Karantina tamamlandıktan sonra heyet, rehberler eşliğinde yolculuğuna devam eder. Güney Fransa'da kanal ve nehir güzergâhlarından yararlanılır.","Akdeniz'den gelen gemilerin kanallar aracılığıyla iç kesimlere ve Atlantik yönüne geçebilmesi, Mehmed Efendi'nin dikkatini çeken mühendislik uygulamalarındandır. Kanal havuzlarında su seviyesi değiştirilerek teknelerin ilerlemesi sağlanır."],ph:[P("Canal du Midi kilitleri","canal","#3f7f8a","Rxww-_N0LGJMKZRqpw77dgiRsPSEAXt9Q_ZMwCX0EGgNuwi5gfo66kTdMm_wNtBlFSr_ZR90SgJiCVqv0Z-RG4ny3NFJTPOKbArVBeEeJctFqY8KgPbzLyGkEDwIXlJX2pkIIZYaJG6o09tUuWZEfgLyrl01g4mZT7xaQMR42f1WMMikWldow-c_4bHdKZt-")]},
{n:9,x:15.9,y:48.7,ll:[43.605,1.444],t:"Toulouse",s:"2 Şubat 1721 · Varış",p:["Toulouse'a ulaşıldığında şehrin halkı Osmanlı elçisini görmek için çevre yerlerden gelir ve sokakları doldurur. Sefaretname çevirisinde kalabalığın yoğunluğu nedeniyle bazı kişilerin itişme sırasında nehre düştüğü bile anlatılır.","Garonne Nehri'nde başka gemiler bulunduğundan heyet üç gün beklemek zorunda kalır."],ph:[P("Toulouse, 1650 gravürü","canal","#4a7f8a","DT7nhOF8PhV5yWhPHSGa75V2y2iiKTRB6qTclm3lLkkOKMlzNU_qJLRb0P8Zy7oDyXwaAf2MB5fgDbRb8vSYhlUDr_5TjgJwAWfUQqkuwjGi1LJTIWlujGtbQ-7Ggb5zYsphsj401D9qnggv-D0zOJZ9pYkpzUUuEl0HeLOrJdUogq4-u_nFmw4TvENIqev2")]},
{n:10,x:10.8,y:41.7,ll:[44.838,-0.579],t:"Bordeaux",s:"Şubat 1721 · Med-cezir gözlemi",p:["Nehir boyunca ilerleyen heyet Bordeaux'ya ulaşır. Mehmed Efendi burada deniz suyunun yükselip alçalması anlamına gelen med-cezir (gelgit) olayını gözlemler. Su çekildiğinde kıyıya yakın gemilerin karada kalması, su yükseldiğinde yeniden yüzebilmesi ona ilginç gelir.","Limanda yüzlerce gemi görülür, yaz aylarında limana daha da fazla gemi toplandığı anlatılır. Bu gözlemler sefaretnameye yalnızca diplomatik değil, coğrafi ve bilimsel bir nitelik de kazandırır."],ph:[P("Bordeaux limanı (Cochin – Le Bas)","port","#2f6f86","1O9zTb0VogJ66CLK7_b9_IE6s8F9asFzfQuUuyGvUu-i1eD678f7NC7YwncVL2OJz8pdezN_ShS1E7FP2MydA_H0_HsxB9CH-8vFwnVGQY8t-ojd_xcZ_ITbASSEc7lBs03fNXuK2May9_AX0OdWCpdFiCel4pd5yQzGWPFcffP73Q1JBVmF1dMpTQB0BUwW")]},
{n:11,x:9.4,y:37.1,ll:[45.128,-0.666],t:"Blaye",s:"Şubat 1721 · Deniz yolculuğunun sonu",p:["Bordeaux'dan sonra Blaye Kalesi'ne ulaşılır. Kral tarafından gönderilen arabalar ve görevliler burada beklemektedir. Heyet gemiden ayrılır, Paris'e kadar olan yolculuğun kara yoluyla sürdürülmesi planlanır.","Böylece İstanbul'dan başlayan deniz yolculuğu sona erer."],ph:[P("Blaye Kalesi","port","#6f8a4f","4PBMCOBpObvaAv_TSjvZbCWJumgHr8rD09usdEg3WdL8qMgE-mftc6G5xIlFRB37IVG8jQDkcXrd321893ClBYAOEjD-Diu98QUuv33BEFS5i_tB8a988szedhhzit89_aFuEe7aKVsd3t_Dfkc8poMMOmwox7racETNRnq-DL6-qgQV6b4mN7g8HMZKce7h")]},
{n:12,x:17.3,y:22.5,ll:[47.903,1.909],t:"Orléans",s:"15 Şubat 1721'den itibaren · Kara yoluyla Paris'e",p:["Blaye'den hareket eden heyet, Fransa'nın iç kesimlerinden geçerek Orléans'a ulaşır. Yol üzerinde kralın avlanma alanları ve konaklama noktaları bulunur.","Orléans'ta bir gece kalındıktan sonra Paris'e doğru yola devam edilir."],ph:[P("Orléans","road","#6f8a4f","ounmL4NnW_79BEvamspVx8AZoPB2Io__b4Hln7B2G9xU0Y6mS9FWCriFM7301j2Cn1mNEmWE1egYlqRxKzGuPYvw4KXDn1YqwH6Vlh11RN3lmsW_LPtKCj13TJI5Y6rFM8-lZ3E4zylzdX0yyTNNM7PhqL9dedJtE8Vcj3kq36P6P1tDrbAineUUotYM3vr5")]},
{n:13,x:21.7,y:17.6,ll:[48.84,2.42],t:"Paris'e varış",s:"7 Mart 1721",p:["Elçilik heyeti Paris'in kenarında kendileri için hazırlanmış saraya ulaşır. Şehir halkı Osmanlı heyetini merakla görmek ister, ziyaretçiler gece gündüz konaklama yerine gelir.","Mehmed Efendi, Paris'e daha önce gelen bazı elçilerden farklı olarak kendisine olağanüstü bir ilgi gösterildiğini ve resmî kabul için özel hazırlıklar yapıldığını aktarır."],ph:[P("Paris panoraması, 18. yüzyıl (Augsburg)","fr","#4a6d8a","Uj297PeleXDsnfZumN8h68G40mZsbwDtEn4XRz-6yz-Yj9z14bbVfa69A4vpgBwkkllL_V9LlGjI-q3fB9iU4_Es-fwaRFleQv6-fGYzcUftjZgveAZonPJ7rwW4kWUieQz-u0UFpAYfIC6vfp6ZzZpJPM6y5PIRjeCHdm4HNlZi3MfrMz_Nh-MEc_se1wHT")]},
{n:14,x:18.4,y:16.3,ll:[48.8635,2.3275],t:"Tuileries Sarayı",s:"21 Mart 1721 · Kral XV. Louis tarafından kabul",p:["Osmanlı elçisi, Fransa Kralı XV. Louis tarafından Tuileries Sarayı'nda kabul edilir. Henüz çocuk yaştaki (11 yaşında) kralın huzuruna çıkılırken Osmanlı heyetine özel bir tören düzenlenir. Mehmed Efendi'nin anlatımına göre Paris'e gelen elçilere daha önce bu ölçüde bir merasim yapılmamıştır.","Kralın kendi arabası elçiye tahsis edilir ve heyete eşlik etmek üzere Fransız devlet görevlileri görevlendirilir. Geçit töreni boyunca 30 bin askerin yeni kıyafetleriyle yol boyunca dizildiği aktarılır. Sokaklar ve saraya giden güzergâh kalabalıkla dolar, halk pencerelere ve yol kenarlarına toplanır.","Kabul sırasında Sultan III. Ahmed'in ve Sadrazam Nevşehirli Damat İbrahim Paşa'nın mektupları sunulur. Kral çocuk yaşta olduğu için elçinin sözlerine doğrudan cevap vermez, yanındaki mareşal kral adına iki devlet arasındaki dostluğun güçlendirilmesinden duyulan memnuniyeti bildirir.","Osmanlı kıyafetleri, heyetin düzeni ve elçinin temsil ettiği devlet Fransız halkının merakını artırır. Elçilik, Avrupa kültür tarihinde Turquerie olarak adlandırılan dönemin kıvılcımını çakmıştır."],ph:[P("Elçinin Tuileries'ye gelişi, 21 Mart 1721","hall","#8f2f2a","RSULFHnGnj44hdGSAHUcgYLNDKKWvy_caFzyLkeq3oyVENU2PZ-uVLTBNmcSFi8pAwCvcVsUNsvAql9ksBvfDJ0-o6RnzPeiYXFzWD5tRMRI46Bp9_6c2MLnrwRRNTmMOEpZqGFP2q8MY56bG7EZJ9_aXtUVO4I7mwmcJl6u7-sMnKKwMf9jehG1d2Dxvqmd")]},
{n:15,x:15.5,y:13.2,ll:[48.9,2.29],t:"Paris'ten ayrılış",s:"6 Ağustos 1721",p:["Elçilik görevini tamamlayan Mehmed Efendi ve heyeti, İstanbul'a dönmek üzere Paris'ten hareket eder.","Sefaretname çevirisinde dönüşten önce kralın sarayında bir veda görüşmesi ve büyük bir gece şenliği anlatılır. Şenlikte on binden fazla mum yakıldığı, ışıkların havuzlara yansıdığı ve gösteriler arasında Osmanlı padişahının simgesi olan ayın da gösterildiği aktarılır."],ph:[P("XV. Louis döneminde Paris sokağı","fr","#6d6a8a","Wc86Z_EblMjZ8463W36UabzWVMVW_KriF6rT1RWp2sdTCipby-meZUoYTOSq-qobhMVeW1MyYxqjToWZmwf9duOhZAbeiX2NfeqlpaFL7TyTlcknvJSde-BNuqAqXl67VNmJ7CIuGIfYLOzT7fI0JXSYjygdXOPX-hNKvxXV_ouf97wwfo-nifG5K1xnEKVh")]},
{n:16,x:23.4,y:32.4,ll:[46.3,4.2],t:"Fransa'dan limana kara yolu",s:"Ağustos–Eylül 1721",p:["Paris'ten ayrıldıktan sonra heyet, çok sayıda kent, köy ve kasabadan geçerek deniz yolculuğunun başlayacağı limana doğru ilerler.","Haritadaki nokta, güzergâhın tam yerini değil, Paris ile Akdeniz kıyısı arasındaki kara yolculuğunu temsil eder."],ph:[P("18. yüzyıl Fransız arabası","road","#a0793c","xFHkGAnDwbOJ8BbFoK1Rm-HUjCJFJlKDa3uz_7ZOjEk8YtOXcwQ93HYDS6cn_R-JQMy0gSyYTWRPrjNrU-HLv8TVDv2dpBXzjtVnF9VA70HLZCnOtvXeCo2-VwWEd3iMtwc6Y_T6pgec9GaC7qOm9Q-l2INLneAzx2-nKsHwdemoE4xJRhnRoCBChGS4lOCH")]},
{n:17,x:23.0,y:58.9,ll:[43.33,3.7],t:"Sète: dönüş gemileri",s:"8 Eylül 1721 · İki büyük gemiye biniş",p:["Sefaretname çevirisinde bu tarihte heyet için hazırlanmış iki büyük gemiye binildiği belirtilir. Böylece dönüş yolculuğunun deniz aşaması başlar.","Gidişte olduğu gibi dönüşte de Akdeniz'deki hava koşulları yolculuğun seyrini etkiler."],ph:[P("Sète limanı","port","#2f6f86","ndN0tZxH9cjcJnKuFGpaJYuPo6Jt0dJA3iudekUjn8vCmSF_GL19YA8nd2iIwjC5NWpGgD-Spi5bIV68xSooiWpe2Vdlu_36LYL4maj1W6-ShVX6AX3qc8eNnN3jGLJUz-2HGnpnYa-2wDV9LoeVDdQWR3mzHniXup8uEJlHR2VWS7EuFV3yjHc5_8UnYX07")]},
